name: Publish sandbox images

on:
  push:
    branches:
      - main
    paths:
      - "Containerfile.*"
      - "config/**"
      - ".github/workflows/publish-images.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-push:
    name: Build and push ${{ matrix.image.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        image:
          - name: codex-sandbox
            file: Containerfile.codex
          - name: claude-sandbox
            file: Containerfile.claude
          - name: opencode-sandbox
            file: Containerfile.opencode

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.image.file }}
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image.name }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
