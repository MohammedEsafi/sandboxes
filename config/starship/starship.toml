add_newline = false

format = '${custom.container}$directory$git_branch$git_commit$git_status$git_state$status$character'

[custom.container]
command = 'printf "(sbx) "'
when = 'true'
style = 'blue'
format = '[$output]($style)'

[directory]
style = 'red'
truncation_length = 2
truncate_to_repo = false
truncation_symbol = '.../'
format = '[❯ $path]($style)'

[git_branch]
style = 'yellow'
format = ' [\($branch]($style)'
symbol = ''

[git_commit]
style = 'yellow'
only_detached = true
tag_disabled = false
tag_symbol = ' '
format = '[:$hash$tag]($style)'
commit_hash_length = 7

[git_status]
style = 'yellow'
format = '( [$all_status$ahead_behind]($style))[\)]($style)'
conflicted = '!'
up_to_date = '✔'
modified = '*'
staged = '+'
untracked = '⋯'
stashed = ''
ahead = '↑${count}'
behind = '↓${count}'
diverged = '↑${ahead_count}↓${behind_count}'

[git_state]
style = 'yellow'
format = ' [$state( $progress_current/$progress_total)]($style)'

[status]
disabled = false
style = 'red'
format = ' \[[$status]($style)\]'
pipestatus = true
pipestatus_format = ' \[[$pipestatus]($style)\]'
pipestatus_separator = '|'
pipestatus_segment_format = '[$status]($style)'

[character]
success_symbol = ' [%](white)'
error_symbol = ' [%](red)'
